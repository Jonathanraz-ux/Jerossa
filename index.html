<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo-jerossa.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jerossa | Vanille d'exception & Épices de Madagascar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Jerossa — Plateforme B2B de matières premières d'exception de Madagascar et Maurice. Vanille, cacao, épices, huiles essentielles." />
    <meta name="theme-color" content="#8c6239" />
  </head>
  <body>
    <div id="root">
      <div id="jrs-splash">
        <img src="/logo-jerossa.jpeg" alt="Jerossa" class="jrs-splash-logo" />
        <div class="jrs-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <style>
      #jrs-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #faf7f2;
        z-index: 2147483647;
      }
      #jrs-splash .jrs-splash-logo {
        width: min(150px, 40vw);
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(140, 98, 57, 0.18);
      }
      #jrs-splash .jrs-splash-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(140, 98, 57, 0.2);
        border-top-color: #8c6239;
        border-radius: 50%;
        animation: jrs-spin 0.8s linear infinite;
      }
      @keyframes jrs-spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
